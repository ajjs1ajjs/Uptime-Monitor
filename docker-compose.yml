services:
  uptime-monitor:
    build: .
    container_name: uptime-monitor
    ports:
      - "8080:8080"
    volumes:
      - uptime-data:/data
      - ./config.json:/config/config.json
    environment:
      - CONFIG_PATH=/config/config.json
      - DATA_DIR=/data
      - LOG_DIR=/logs
      - DB_PATH=/data/sites.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  uptime-data:
