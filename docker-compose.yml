services:
  uptime-monitor:
    build: .
    container_name: uptime-monitor
    ports:
      - "8080:8080"
    volumes:
      - uptime-data:/data
      - ./config.json:/config/config.json
    environment:
      - CONFIG_PATH=/config/config.json
      - DATA_DIR=/data
      - LOG_DIR=/logs
      - DB_PATH=/data/sites.db
    restart: unless-stopped
    # Resource limits so a runaway process (or an admin-configured monitor
    # target that returns huge/slow responses) can't exhaust the host.
    mem_limit: 512m
    cpus: 1.0
    # Container already runs as the non-root "uptime" user (Dockerfile); this
    # further removes the ability to gain any additional Linux capability or
    # privilege even if the process were compromised.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  uptime-data:
