name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Pages
        uses: actions/configure-pages@41d8f096a32819b8d2e185c1dbb0d911d8999831 # v5

      # Stage only the landing page. Uploading the repository root published
      # everything in the tree - workflows, installer, and (with .nojekyll,
      # which disables Jekyll's dotfile filtering) dot-directories too. The
      # page's screenshots are served from raw.githubusercontent.com, so
      # index.html plus .nojekyll is the whole site.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
          ls -la _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e7420261def2710fa7f190f023f6a721 # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164acdf7d05f8babe7a2375892830f487d # v4
