name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Stage only the landing page. Uploading the repository root published
      # everything in the tree - workflows, installer, and (with .nojekyll,
      # which disables Jekyll's dotfile filtering) dot-directories too. The
      # page's screenshots are served from raw.githubusercontent.com, so
      # index.html plus .nojekyll is the whole site.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
          ls -la _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
