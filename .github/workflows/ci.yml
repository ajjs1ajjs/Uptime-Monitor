name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race ./...

      - name: Build binary
        run: go build -o uptime-monitor ./cmd/uptime-monitor

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t uptime-monitor:ci .

      - name: Smoke test (liveness)
        run: |
          docker run -d --name um-ci -p 18080:8080 uptime-monitor:ci
          for i in $(seq 1 15); do
            if docker exec um-ci wget -qO- http://127.0.0.1:8080/health/live >/dev/null 2>&1; then
              echo "liveness OK"; break
            fi
            if [ "$i" = "15" ]; then echo "liveness FAILED"; docker logs um-ci; exit 1; fi
            sleep 2
          done
          docker stop um-ci && docker rm um-ci
