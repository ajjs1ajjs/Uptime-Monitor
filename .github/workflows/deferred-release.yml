name: Deferred release (quota queue)

# One-shot queue: fires after the Actions quota reset on 2026-10-01.
# 07:00 UTC leaves a buffer for the billing-cycle reset to apply.
# Self-contained on purpose: pushing a tag with GITHUB_TOKEN would NOT
# trigger release.yml (GitHub suppresses workflow-to-workflow triggers),
# so this job builds and publishes the release itself instead of chaining.
# Safe to keep afterwards: if the release already exists it exits as no-op.
# Manual fallback at any time: Actions -> this workflow -> Run workflow.

on:
  schedule:
    # A scheduled run is SKIPPED, not queued, if the Actions quota is still
    # exhausted at that moment - and GitHub may also drop a schedule under
    # load. So there are retries: the job is idempotent (it exits as a no-op
    # once the release exists), and each no-op run costs seconds.
    - cron: "0 7 1 10 *"
    - cron: "0 13 1 10 *"
    - cron: "0 7 2 10 *"
    - cron: "0 7 3 10 *"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.6.0). Empty = derive from const Version in main.go'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            VER="$(grep -oP 'const Version = "\K[^"]+' cmd/uptime-monitor/main.go)"
            TAG="v$VER"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Skip if release already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.tag.outputs.tag }} already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.exists.outputs.exists != 'true'
        run: go test ./...

      - name: Build binaries
        if: steps.exists.outputs.exists != 'true'
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/uptime-monitor-linux-amd64 ./cmd/uptime-monitor
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/uptime-monitor-linux-arm64 ./cmd/uptime-monitor
          cd dist
          sha256sum * > checksums.txt

      - name: Create release
        if: steps.exists.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --title "Uptime Monitor $TAG" \
            --generate-notes