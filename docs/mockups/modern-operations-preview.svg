      .label{font-size:12px;letter-spacing:1.2px;text-transform:uppercase}.title{font-size:22px;font-weight:700}
      .value{font-size:28px;font-weight:700}.bold{font-weight:650}.green{fill:#34d399}.red{fill:#fb7185}.amber{fill:#fbbf24}.blue{fill:#38bdf8}
    </style>
  </defs>

